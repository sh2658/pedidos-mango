<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#1F4B3F;
    --verde-oscuro:#153A31;
    --crema:#F7F1E6;
    --mostaza:#D9A441;
    --carbon:#262421;
    --blanco:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--carbon);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;
    letter-spacing:.01em;
    margin:0;
  }
  header{
    background:var(--verde);
    color:var(--crema);
    padding:1.5rem 1.25rem 1.75rem;
  }
  .encabezado{
    max-width:680px;margin:0 auto;display:flex;align-items:center;gap:1rem;
  }
  .logo-negocio{
    width:104px;height:104px;flex:0 0 104px;object-fit:cover;
    border-radius:50%;border:4px solid var(--crema);
    background:var(--blanco);box-shadow:0 5px 18px rgba(0,0,0,.22);
  }
  header h1{font-size:2.1rem;}
  header p{margin:.3rem 0 0;opacity:.85;font-size:.95rem;}

  @media (max-width:480px){
    header{padding:1.1rem 1rem 1.25rem;}
    .encabezado{gap:.8rem;}
    .logo-negocio{width:82px;height:82px;flex-basis:82px;border-width:3px;}
    header h1{font-size:1.85rem;line-height:1.05;}
    header p{font-size:.88rem;line-height:1.35;}
  }

  main{max-width:680px;margin:0 auto;padding:1.25rem;}

  .paso{display:none;}
  .paso.activo{display:block;}

  .campo{margin-bottom:1rem;}
  .campo label{display:block;font-size:.85rem;margin-bottom:.35rem;color:var(--verde-oscuro);font-weight:600;}
  .campo input{
    width:100%;padding:.75rem .9rem;border:2px solid #E2D9C4;border-radius:6px;
    font-size:1rem;font-family:inherit;background:var(--blanco);
  }
  .campo input:focus{outline:none;border-color:var(--verde);}

  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:.95rem;
    border:none;border-radius:6px;padding:.85rem 1.4rem;cursor:pointer;
  }
  .btn-primario{background:var(--verde);color:var(--crema);}
  .btn-primario:hover{background:var(--verde-oscuro);}
  .btn-secundario{background:transparent;color:var(--verde);border:2px solid var(--verde);}

  .producto{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    background:var(--blanco);border-radius:10px;padding:1rem;margin-bottom:.75rem;
    border:1px solid #EAE1CC;
  }
  .producto-info h3{font-size:1.05rem;font-family:'Inter',sans-serif;font-weight:600;}
  .producto-info .precio{color:var(--verde-oscuro);font-weight:600;margin-top:.15rem;}
  .producto-info .unidad{color:#6B6459;font-size:.82rem;}

  .cantidad{display:flex;align-items:center;gap:.5rem;}
  .cantidad button{
    width:34px;height:34px;padding:0;background:var(--mostaza);color:var(--carbon);
    font-size:1.1rem;line-height:1;
  }
  .cantidad span{min-width:1.5rem;text-align:center;font-weight:600;}

  .carrito-flotante{
    position:sticky;bottom:0;background:var(--verde);color:var(--crema);
    display:flex;justify-content:space-between;align-items:center;
    padding:1rem 1.25rem;border-radius:10px 10px 0 0;margin-top:1rem;
  }
  .carrito-flotante button{background:var(--mostaza);color:var(--carbon);}

  .resumen-item{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #EAE1CC;}
  .total{display:flex;justify-content:space-between;font-weight:700;margin-top:.75rem;font-size:1.1rem;}

  .confirmacion{text-align:center;padding:2rem 1rem;}
  .confirmacion .icono{font-size:2.5rem;}

  .aviso{
    background:#FFF8E8;border:1px solid var(--mostaza);border-radius:8px;
    padding:.75rem 1rem;font-size:.85rem;margin-bottom:1rem;color:#6B5218;
  }
</style>
</head>
<body>

<header>
  <div class="encabezado">
    <img class="logo-negocio" src="logo-ceviche-mango.jpeg" alt="Logo de Ceviche de Mango">
    <div>
      <h1>Catálogo de pedidos</h1>
      <p>Elegí tus productos y armá tu pedido.</p>
    </div>
  </div>
</header>

<main>

  <!-- Paso 1: identificación -->
  <section id="paso-telefono" class="paso activo">
    <div class="campo">
      <label for="telefono">Tu número de WhatsApp</label>
      <input type="tel" id="telefono" placeholder="8888-8888">
    </div>
    <button class="btn-primario" onclick="identificarCliente()">Continuar</button>
  </section>

  <!-- Paso 2: catálogo -->
  <section id="paso-catalogo" class="paso">
    <div id="lista-productos"></div>
    <div class="carrito-flotante" id="barra-carrito" style="display:none;">
      <span id="resumen-carrito">0 items</span>
      <button onclick="mostrarPaso('paso-checkout')">Ver pedido</button>
    </div>
  </section>

  <!-- Paso 3: datos y confirmación -->
  <section id="paso-checkout" class="paso">
    <h2 style="margin-bottom:1rem;">Confirmar pedido</h2>
    <div id="resumen-pedido"></div>
    <div class="total"><span>Total</span><span id="total-pedido">₡0</span></div>

    <div class="campo" style="margin-top:1.5rem;">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre">
    </div>
    <div class="campo">
      <label for="direccion">Dirección (referencias)</label>
      <input type="text" id="direccion">
    </div>

    <div class="aviso" id="aviso-ubicacion">
      Vamos a pedirte tu ubicación para calcular la ruta de entrega.
    </div>

    <button class="btn-secundario" onclick="mostrarPaso('paso-catalogo')">Volver al catálogo</button>
    <button class="btn-primario" onclick="confirmarPedido()">Enviar pedido</button>
  </section>

  <!-- Paso 4: confirmación -->
  <section id="paso-confirmado" class="paso">
    <div class="confirmacion">
      <div class="icono">✔</div>
      <h2>Pedido recibido</h2>
      <p>Guardá tu número de WhatsApp — con él podés consultar el estado de tu pedido.</p>
      <a id="link-whatsapp" href="#" target="_blank">
        <button class="btn-primario">Avisar por WhatsApp</button>
      </a>
    </div>
  </section>

</main>

<script>
  // ⚠️ Reemplazar con la URL de la implementación del Apps Script Web App
  const CONFIG_APP_URL = 'https://script.google.com/macros/s/AKfycbxmhvQRhPukChM8PSwFVnRjRFk7r4rCPZ0W2UFELZb6WfojcPFbwASZ-uY174noJdLq/exec';
  // ⚠️ Número de WhatsApp del negocio para el aviso manual (formato internacional sin +)
  const CONFIG_WHATSAPP_NEGOCIO = 'PENDIENTE';

  let catalogo = [];
  let carrito = {};
  let clienteActual = { telefono:'', nombre:'', direccion:'', gps:'' };

  function mostrarPaso(id){
    document.querySelectorAll('.paso').forEach(p => p.classList.remove('activo'));
    document.getElementById(id).classList.add('activo');
  }

  async function identificarCliente(){
    const telefono = document.getElementById('telefono').value.trim();
    if(!telefono){ alert('Ingresá tu número de WhatsApp'); return; }
    clienteActual.telefono = telefono;

    try{
      const res = await fetch(`${CONFIG_APP_URL}?action=cliente&telefono=${encodeURIComponent(telefono)}`);
      const datosCliente = await res.json();
      if(datosCliente){
        clienteActual.nombre = datosCliente.Nombre;
        clienteActual.direccion = datosCliente.Direccion;
        clienteActual.gps = datosCliente.Gps;
      }
    }catch(err){ console.warn('No se pudo consultar cliente existente', err); }

    await cargarCatalogo();
    mostrarPaso('paso-catalogo');
  }

  async function cargarCatalogo(){
    const res = await fetch(`${CONFIG_APP_URL}?action=catalogo`);
    catalogo = await res.json();
    dibujarCatalogo();
  }

  function dibujarCatalogo(){
    const cont = document.getElementById('lista-productos');
    cont.innerHTML = catalogo.map(p => `
      <div class="producto">
        <div class="producto-info">
          <h3>${p.Nombre}</h3>
          <div class="precio">₡${Number(p.Precio).toLocaleString('es-CR')}</div>
          <div class="unidad">${p.Unidad || ''}</div>
        </div>
        <div class="cantidad">
          <button onclick="cambiarCantidad('${p.ID_Producto}', -1)">−</button>
          <span id="cant-${p.ID_Producto}">${carrito[p.ID_Producto]?.Cantidad || 0}</span>
          <button onclick="cambiarCantidad('${p.ID_Producto}', 1)">+</button>
        </div>
      </div>
    `).join('');
    actualizarBarraCarrito();
  }

  function cambiarCantidad(id, delta){
    const producto = catalogo.find(p => p.ID_Producto === id);
    const actual = carrito[id]?.Cantidad || 0;
    const nueva = Math.max(0, actual + delta);
    if(nueva === 0){ delete carrito[id]; }
    else{ carrito[id] = { ...producto, Cantidad: nueva }; }
    document.getElementById(`cant-${id}`).textContent = nueva;
    actualizarBarraCarrito();
  }

  function actualizarBarraCarrito(){
    const items = Object.values(carrito);
    const totalItems = items.reduce((s,i) => s + i.Cantidad, 0);
    const barra = document.getElementById('barra-carrito');
    barra.style.display = totalItems > 0 ? 'flex' : 'none';
    document.getElementById('resumen-carrito').textContent = `${totalItems} items`;
  }

  function dibujarResumenPedido(){
    const items = Object.values(carrito);
    const cont = document.getElementById('resumen-pedido');
    let total = 0;
    cont.innerHTML = items.map(i => {
      const subtotal = i.Cantidad * Number(i.Precio);
      total += subtotal;
      return `<div class="resumen-item"><span>${i.Cantidad} × ${i.Nombre}</span><span>₡${subtotal.toLocaleString('es-CR')}</span></div>`;
    }).join('');
    document.getElementById('total-pedido').textContent = `₡${total.toLocaleString('es-CR')}`;
    document.getElementById('nombre').value = clienteActual.nombre || '';
    document.getElementById('direccion').value = clienteActual.direccion || '';
  }

  document.querySelector('[onclick="mostrarPaso(\'paso-checkout\')"]')?.addEventListener?.('click', dibujarResumenPedido);
  // Refuerzo por si el navegador no engancha el inline handler anterior:
  document.getElementById('barra-carrito').addEventListener('click', dibujarResumenPedido);

  function obtenerUbicacion(){
    return new Promise((resolve) => {
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(`${pos.coords.latitude},${pos.coords.longitude}`),
        () => resolve(null),
        { timeout: 8000 }
      );
    });
  }

  async function confirmarPedido(){
    const nombre = document.getElementById('nombre').value.trim();
    const direccion = document.getElementById('direccion').value.trim();
    if(!nombre || !direccion){ alert('Completá nombre y dirección'); return; }

    document.getElementById('aviso-ubicacion').textContent = 'Obteniendo tu ubicación…';
    const gps = await obtenerUbicacion() || clienteActual.gps || '';

    const items = Object.values(carrito).map(i => ({
      ID_Producto: i.ID_Producto, Nombre: i.Nombre, Cantidad: i.Cantidad, Precio: i.Precio
    }));

    const body = { action:'guardarPedido', telefono: clienteActual.telefono, nombre, direccion, gps, items };

    try{
      await fetch(CONFIG_APP_URL, { method:'POST', body: JSON.stringify(body) });
    }catch(err){
      alert('No se pudo enviar el pedido, probá de nuevo.');
      return;
    }

    const total = document.getElementById('total-pedido').textContent;
    const mensaje = encodeURIComponent(`Nuevo pedido de ${nombre} (${clienteActual.telefono}) por ${total}`);
    document.getElementById('link-whatsapp').href = `https://wa.me/${CONFIG_WHATSAPP_NEGOCIO}?text=${mensaje}`;

    mostrarPaso('paso-confirmado');
  }
</script>

</body>
</html>
